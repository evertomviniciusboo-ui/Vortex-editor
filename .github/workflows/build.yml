name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extrair projeto
        run: |
          unzip -q vortex-editor.zip -d work
          echo "PROJ=$(dirname "$(find work -name settings.gradle.kts | head -1)")" >> "$GITHUB_ENV"
      - name: Compilar APK
        run: gradle -p "$PROJ" assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vortex-editor-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
